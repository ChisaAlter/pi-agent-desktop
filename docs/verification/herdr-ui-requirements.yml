# Herdr GUI 需求登记表（机器可读，防降级治理）
#
# 权威来源（冲突时按此序裁决）：
#   1. docs/prototypes/herdr-desktop-ui-prototype.html（视觉唯一权威，已批准）
#   2. docs/compose/specs/2026-08-12-herdr-ui-prototype-approved.md（语义契约，已批准）
#   3. docs/compose/plans/2026-08-12-herdr-ui-implementation-plan.md（执行合同）
#
# status 取值: NOT_RUN | IN_PROGRESS | PASS | FAIL | BLOCKED
# evidence_class: interaction-test | visual-diff | negative-check | real-runtime | package-acceptance
# 规则（由 scripts/verification/check-herdr-ui.cjs 强制执行）：
#   - 每条需求必须登记本表，ID 集合必须与 checker 内建 canonical 集合完全一致（增删都 FAIL）
#   - PASS 必须提供 evidence 列表且每个文件存在、非空且 ≥64 bytes
#   - 存在任一 BLOCKED 时整体报告"未完成"，禁止汇总为 PASS
#   - 负面清单（negative list）：文本可扫项由 check-herdr-ui.cjs 逐条扫描（命中即 FAIL），
#     行为语义项（NL-001/004/007/008/009/011/013/014）由 e2e/herdr/prototype-parity 在 CI 强制执行

# 决策记录（用户在 2026-08-12 批准计划时确认的默认决策，可纠正）
decisions:
  - id: D1
    title: 运行时路线
    value: 官方 Herdr 二进制套壳（named-pipe JSON-RPC 客户端、官方 integration、真实 pane 终端）
    source: 设计契约 §7 + 实现计划 Phase 3；deep-dive spike §8 底座原语仅作协议理解参考
  - id: D2
    title: 本会话范围
    value: Phase 0→2 完整执行 + real-herdr-integration 运行时契约初稿；Phase 3-5 标记 BLOCKED
  - id: D3
    title: 工作树基线
    value: 现有工作树提交为基线 commit（阶段分支内，不碰 master）；docs/compose/acceptance PNG 为真实内容差异（1.5x 重导出），未纳入基线，保留工作树待用户处置
  - id: D4
    title: 布局作用域
    value: studio/mission/terminal 切换器仅在「智能体/任务编排」tab 显示（浮左下）；terminal 暗色只作用于 Herdr 控制面区域
  - id: D5
    title: 状态条
    value: 全局常显（原型一致）；无检查更新/验证/切换按钮
  - id: D6
    title: Mock 激活
    value: PI_HERDR_MOCK=1 env 激活；mock store 文件头 PROTOTYPE_MOCK 标记；mock 关闭且无运行时 → 空态/断线态
  - id: D7
    title: 状态模型映射
    value: 现有 error/closed 输入映射为「状态未知」；断线时全部「连接已断开」；done=idle+unseen；优先级 Blocked>Done>Working>Idle>Unknown
  - id: D8
    title: 计划文字修正
    value: UI-REQ-001 计划原文写"5 tab"但列 6 项，原型为 6 tab（对话|智能体|任务编排|运行|工作台|扩展），以原型为准

# 负面清单（计划 §2 禁止替代清单的机器可扫部分；命中即 FAIL）
negative_list:
  - id: NL-001
    text: 用扁平 Agent 卡片列表代替 session→workspace→tab→pane 层级树
    check: HerdrTree 存在且渲染 4 级层级（e2e 结构断言）
  - id: NL-002
    text: 状态条放回「检查更新/验证/切换」按钮，或把兼容性/版本塞成第三排
    check: HerdrStatusBar 源码不得含 检查更新/验证/切换 按钮文案或等价 data-action
  - id: NL-003
    text: 卡片重新出现彩色侧边框（红/蓝/紫）
    check: AgentCard 源码不得含 border-l-* 彩色类或 border-left 颜色声明
  - id: NL-004
    text: 卡片出现多个同权主按钮（超过 1 个 primary CTA）
    check: AgentCard 主操作区最多 1 个 primary CTA（e2e 断言）
  - id: NL-005
    text: 删除/改名/合并「智能体」与「任务编排」两个 tab
    check: TopTabBar 含 agents 与 mission 两个 tab（e2e 断言）
  - id: NL-006
    text: 设置做成弹窗/对话框而不是设置窗口内的 tab
    check: herdr 设置内容位于设置窗口 tab（HerdrTab 被 SettingsContent lazy 引用）；renderer 不得出现 settings-modal/settings-dialog 类
  - id: NL-007
    text: 断线后显示陈旧 working/done，或把 disconnected 渲染成 idle
    check: e2e 断线用例断言全部 disconnected
  - id: NL-008
    text: 在 GUI 伪造 blocked 审批（必须真实 pane 内处理）
    check: blocked 处理动作必须进入终端视图而非本地批准（e2e 断言）
  - id: NL-009
    text: 跳过「最终合入用户确认」
    check: mission 整合必须有用户确认模态（e2e 断言）
  - id: NL-010
    text: 用 mock 数据、seed 卡片、注入事件通过真实验收门
    check: real-runtime/package-acceptance 证据不得来自 mock；mock store 必须带 PROTOTYPE_MOCK 标记
  - id: NL-011
    text: 用「类似布局」代替原型布局
    check: parity 视觉对比矩阵 PASS（区域 diff 容差内）
  - id: NL-012
    text: 中文文案又改回大量英文（技术名词除外）
    check: i18n 双语文件同步；UI 文案抽查
  - id: NL-013
    text: 移除状态权威来源/证据边界等真实身份展示
    check: 身份面板与 ContextRail 含 状态来源/证据边界 区块（e2e 断言）
  - id: NL-014
    text: 用 renderer store 推导 Herdr 状态代替 Main 权威 snapshot+seq
    check: Phase 3+ 事件流必须走 Main 权威（UI-REQ-014 证据）
  - id: NL-015
    text: 未实现真实运行时前，把 mock 渲染标成「已完成 Herdr 接入」
    check: UI-REQ-032/045/014 等 real-runtime 类需求在 Phase 3 前必须 BLOCKED，不得 PASS

