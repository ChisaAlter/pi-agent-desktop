# Herdr GUI 阶段门禁记录

> 每个阶段结束由独立审查员（架构审查 + 证据审查，独立于实现者）复核，
> 结论写入本文件。格式：gate → 结论 → 证据 → 遗留项。
> 审查发现必须修复后才记录 PASS；未修复项必须登记为遗留项并说明责任模块。

## G0 — Phase 0 治理基线（2026-08-12，含独立审查-修复闭环）

**独立审查发现（架构审查子代理，见会话记录）**：
- B1（严重）基线未入库（e2e-output 被 gitignore）→ **已修复**：.gitignore 例外放行 `baselines/**`，9 张基线 + manifest 入库
- F1（严重）self-test T1/T3 真空（fixture 缺 canonical 导致"需求缺失"噪音掩盖被测检查）→ **已修复**：fixture 生成全量 41 条 canonical，新增 T3b/T9 断言（BLOCKED 带理由不误报、门开文件缺失必 FAIL）
- F5（严重）parity 不进 CI → **已修复**：ci.yml 新增 chromium 安装 + parity 原型套件步骤
- A2（中）单词扫描可绕过（data-action 等价形式、文件缺失静默放行）→ **已修复**：data-action 等价命中、NL-003/NL-005/NL-012 文件缺失必 FAIL
- A3（中）PASS 证据仅查非空 → **已修复**：≥64 bytes 最小体积
- B2（中）区域几何与 variant 布局冲突（mission/terminal 变体宽度不同）→ **已修复**：visual-compare 按条目 variant 解析区域（220/335、230/270、270/310）
- B3（中）manifest 无校验力 → **已修复**：manifest 记录每张基线 SHA-256，parity 自检校验哈希
- B5（中）toast 时序依赖 → **已修复**：截图前等待 toast 窗口结束（2400ms）；自检覆盖全 9 张
- C2（中）层级断言不验证层级 → **已修复**：indent1/2/3 结构断言
- C3（中）mission/优先级语义零覆盖 → **部分修复**：新增 mission 全流程闭环流 + 设置更新流（oracle）；优先级 rollup 与 useAgentFleet 旧语义测试由 Phase 1 M5 重写时修正
- D1（低）bindSettingsActions 与委托双触发 → **已修复**：移除直接绑定
- D2（中）设置动态绑定零覆盖 → **已修复**：parity 新增设置更新三步流
