- F3（中）运行时契约文档断链（evidence/AGENTS 声称初稿存在）→ **已修复**：措辞改为"待产出"
- F4（中）files/tests 引用不验证 → **已修复**：IN_PROGRESS/PASS 需求的 files/tests 必须真实存在
- C4/漏洞：基线自检无法发现"原型被编辑后重新生成基线" → **登记**：原型变更必须走变更控制 + 重新批准（计划 §3.5），manifest 哈希校验基线完整性
