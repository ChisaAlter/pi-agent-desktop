name: CI

on:
  push:
    branches: [master]
  pull_request:

# 同一分支的新 push 取消旧的运行, 节省 CI 资源。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + Lint + Test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      # 不做 release.yml 里的 NSIS 短路径镜像; verify 只跑 typecheck/lint/test,
      # 不打包, Windows 路径长度足够。pnpm store 缓存复用 install。
      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      # 严格按 AGENTS.md 的验证顺序: typecheck 与 lint 可并行, 但必须都过再跑 test。
      - name: Typecheck
        shell: pwsh
        run: pnpm -r typecheck

      - name: Lint
        shell: pwsh
        run: pnpm -r lint

      - name: Test
        shell: pwsh
        run: pnpm -r test

      - name: Coverage
        shell: pwsh
        run: pnpm --filter @pi-desktop/desktop test:coverage

      - name: Verify documentation facts
        shell: pwsh
        run: pnpm verify:docs

      # Herdr GUI 防降级检查: 需求登记表结构/PASS 证据/负面清单/i18n 键集同步。
      # BLOCKED 需求存在时不视为失败(仅报告"未完成"), 硬违规才失败。
      - name: Verify herdr UI requirements
        shell: pwsh
        run: pnpm verify:herdr

      # Herdr parity 原型目标套件(交互流对齐 + 黄金基线完整性自检)。
      # 基线已入库 docs/verification/baselines/herdr, 自检校验 manifest SHA-256,
      # 可发现基线被篡改/替换/删除。
      - name: Install Playwright chromium (parity)
        shell: pwsh
        run: npx playwright install chromium
      - name: Parity prototype suite (oracle flows + baseline integrity)
        shell: pwsh
        working-directory: apps/desktop
        run: HERDR_PARITY_TARGET=prototype npx playwright test --config=playwright.parity.config.ts

      - name: Build desktop
        shell: pwsh
        run: pnpm --filter @pi-desktop/desktop build

      - name: Smoke test main runtime
        shell: pwsh
        run: node scripts/smoke-main-runtime.cjs