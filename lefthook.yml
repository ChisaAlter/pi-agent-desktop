pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm -r typecheck
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm -r lint
    herdr-check:
      # Herdr 防降级检查器（需求表/证据/负面清单/i18n 同步）；~1s，本地强制（计划 §3.2）
      run: node scripts/verification/check-herdr-ui.cjs

pre-push:
  commands:
    test:
      run: pnpm --filter @pi-desktop/desktop test
    coverage:
      run: pnpm --filter @pi-desktop/desktop test:coverage

commit-msg:
  commands:
    conventional-commit:
      run: node scripts/validate-commit-msg.cjs {1}
